<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pisagoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  <!-- Background circle with smooth gradient -->
  <rect width="100" height="100" rx="24" fill="url(#pisagoGrad)" />
  
  <!-- Musical note & Art Brush icon mark -->
  <g transform="translate(20, 18)">
    <!-- Palette base curve -->
    <path d="M10 42 C6 30 14 16 28 12 C44 8 54 18 52 32 C50 42 40 48 26 48 C18 48 12 46 10 42 Z" fill="white" opacity="0.18" />
    
    <!-- Eighth Musical Note -->
    <circle cx="16" cy="44" r="7" fill="white" />
    <circle cx="36" cy="38" r="7" fill="white" />
    <rect x="21" y="16" width="4" height="28" fill="white" rx="1.5" />
    <rect x="41" y="10" width="4" height="28" fill="white" rx="1.5" />
    <!-- Connecting beam with art wave -->
    <path d="M21 16 L45 10 L45 16 L21 22 Z" fill="white" />
    
    <!-- Paintbrush / Sparkle splash -->
    <circle cx="48" cy="8" r="3.5" fill="url(#artGrad)" />
    <circle cx="8" cy="24" r="2.5" fill="url(#artGrad)" />
    <circle cx="32" cy="52" r="2" fill="url(#artGrad)" />
  </g>
  
  <!-- Subtle label at bottom -->
  <text x="50" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="white" letter-spacing="2">PISAGO</text>
</svg>
