<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="steedGrad" x1="10" y1="10" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="steedAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#steedGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic Athletic Symbol: Powerful Geometric S + Lightning / Steed Gallop Slant -->
  <g filter="url(#glow)">
    <!-- Dynamic Angular Slash 1 (Top Wing) -->
    <path d="M50 72 L125 72 L105 92 L35 92 Z" fill="url(#steedAccent)" />
    <!-- Dynamic Angular Slash 2 (Center Core) -->
    <path d="M75 97 L150 97 L130 117 L60 117 Z" fill="white" />
    <!-- Dynamic Angular Slash 3 (Bottom Thrust) -->
    <path d="M95 122 L165 122 L145 142 L80 142 Z" fill="url(#steedAccent)" />
    <!-- Speed Dots -->
    <circle cx="158" cy="72" r="5" fill="#FF5722" />
    <circle cx="45" cy="142" r="5" fill="white" />
  </g>

  <!-- Brand Subtext -->
  <text x="100" y="172" text-anchor="middle" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" letter-spacing="3.5">
    STEED GYM
  </text>
</svg>
